name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

      - name: Run tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

  notify:
    runs-on: ubuntu-latest
    needs: test
    if: always()

    steps:
      - name: Send ntfy success notification
        if: needs.test.result == 'success'
        run: |
          curl \
            -H "Title: GitHub Actions CI Succeeded" \
            -H "Priority: default" \
            -H "Tags: white_check_mark,github,python" \
            -d "Repository: ${{ github.repository }}
          Workflow: ${{ github.workflow }}
          Branch/Ref: ${{ github.ref_name }}
          Commit: ${{ github.sha }}
          Status: success
          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            https://ntfy.sh/sangwoo-personal

      - name: Send ntfy failure notification
        if: needs.test.result == 'failure'
        run: |
          curl \
            -H "Title: GitHub Actions CI Failed" \
            -H "Priority: high" \
            -H "Tags: x,github,python" \
            -d "Repository: ${{ github.repository }}
          Workflow: ${{ github.workflow }}
          Branch/Ref: ${{ github.ref_name }}
          Commit: ${{ github.sha }}
          Status: failure
          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            https://ntfy.sh/sangwoo-personal
